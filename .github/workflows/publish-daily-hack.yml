name: Publish Daily Hack

# Publica la pagina /daily-hack (y su gemela /es/daily-hack) fusionando dos
# fuentes y empujando SOLO el HTML. Es el paso que, desde el 19/11/2026, hacia
# la tarea diaria del Radar con un git push propio. Ese push fallaba cuando la
# tarea no tenia el repo en su conjunto autorizado, y la pagina se congelaba.
# Aqui lo hace GitHub Actions con su GITHUB_TOKEN, que no puede faltar, asi que
# la publicacion ya no depende de ninguna credencial de la tarea.
#
# Dos fuentes, una sola verdad (igual que tools/merge-radar.py):
#   - data/radar.json : RansomLook + HIBP, que baja el workflow "Daily Hack"
#     (refresh-radar.yml) de madrugada y confirma en main.
#   - rama 'radar-data', carpeta radar-days/ : la investigacion propia del
#     Radar de Ataques (casos de Peru y LatAm, prospectos), que la tarea diaria
#     empuja a esa rama. Es contenido editorial de Selentic con su fuente, NO
#     datos crudos de terceros, por eso puede vivir en un repo publico.
# tools/merge-radar.py las une sin duplicar; tools/build-daily-hack.py arma el
# HTML. Se confirma SOLO el HTML (nunca combinado.json ni incidentes.json: los
# terminos de las fuentes prohiben publicar sus datos crudos).
#
# Disparo por EVENTO, no por horario: el cron de GitHub arranca aqui con horas
# de retraso, asi que "correr despues de la tarea" por cron no es fiable. En su
# lugar, el push de la tarea a la rama radar-data dispara esto al instante. El
# cron diario es solo una red de seguridad: reconstruye con lo ultimo que haya
# en radar-data mas el data/radar.json del dia, de modo que si la tarea no
# empujo, la pagina igual se refresca (sin casos curados nuevos) en vez de
# congelarse.

on:
  push:
    branches: [radar-data]
  schedule:
    # Red de seguridad diaria. 15:30 UTC programado; aunque GitHub lo retrase,
    # reconstruye idempotente: si nada cambio, no confirma nada.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fusionar y armar sin confirmar ni empujar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-daily-hack
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      # Siempre trabajamos sobre main (sus tools, su data/radar.json), aunque el
      # disparo venga de un push a la rama radar-data.
      - name: Traer main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # La investigacion curada vive en la rama radar-data, carpeta radar-days/.
      # Puede no existir todavia (dia 1): en ese caso la carpeta queda vacia y la
      # fusion sale solo con data/radar.json, que es una pagina valida.
      - name: Traer los casos curados de la rama radar-data
        run: |
          mkdir -p /tmp/radar-days
          # merge-radar.py lee *.json planos de la carpeta, asi que volcamos cada
          # radar-days/*.json de la rama con su nombre base. Si la rama no existe
          # (dia 1) la carpeta queda vacia y la fusion sale solo con el sitio.
          if git fetch origin radar-data 2>/dev/null; then
            for f in $(git ls-tree -r --name-only origin/radar-data | grep -E '^radar-days/.*\.json$'); do
              git cat-file -p "origin/radar-data:$f" > "/tmp/radar-days/$(basename "$f")"
            done
          else
            echo 'rama radar-data aun no existe: se arma la pagina solo con data/radar.json'
          fi
          echo "archivos curados: $(ls -1 /tmp/radar-days/*.json 2>/dev/null | wc -l | tr -d ' ')"

      - name: Fusionar las dos fuentes
        run: |
          python3 -I tools/merge-radar.py \
            --radar-days /tmp/radar-days \
            --site data/radar.json \
            --public /tmp/combinado.json \
            --dashboard /tmp/incidentes.json
          python3 -c "import json;d=json.load(open('/tmp/combinado.json'));print('victimas combinadas:', d.get('victimas') or len(d.get('items',[])))"

      - name: Armar las paginas y el sitemap
        run: |
          python3 -I tools/build-daily-hack.py --data /tmp/combinado.json
          python3 tools/build-sitemap.py

      # Una fuente caida devuelve pocos casos sin romper los pasos previos.
      # Confirmar eso publicaria una pagina vacia que se despliega sola.
      - name: Comprobar que la pagina no quedo vacia
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open('/tmp/combinado.json', encoding='utf-8'))
          casos = d['items']
          print(f"{len(casos)} casos en la fusion")
          if len(casos) < 40:
              sys.exit(f'solo {len(casos)} casos: una fuente fallo, no se confirma')
          for p in ('daily-hack/index.html', 'es/daily-hack/index.html'):
              html = open(p, encoding='utf-8').read()
              filas = html.count('<tr data-r')
              print(f'{p}: {filas} filas, {len(html)//1024} KB')
              if filas < 20:
                  sys.exit(f'{p} salio con {filas} filas: no se confirma')
          PY

      - name: Confirmar y empujar solo el HTML
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # SOLO el HTML. Nunca /tmp/combinado.json ni /tmp/incidentes.json: son
          # datos crudos de terceros y el repo es publico.
          git add -A daily-hack es/daily-hack daily-hack.js daily-hack.json sitemap.xml
          if git diff --cached --quiet; then
            echo 'la pagina no cambio hoy'
            exit 0
          fi
          NUEVOS=$(python3 -c "import json;print(json.load(open('daily-hack.json'))['new'])")
          git commit -m "Daily Hack: ${NUEVOS} new victims (page)" \
                     -m "Publicado por .github/workflows/publish-daily-hack.yml (fusion Radar + RansomLook/HIBP)."
          # Entre que empezo esta corrida y este push, main pudo moverse (el job
          # de datos de madrugada, o un PR). Sin rebase el push sale rechazado.
          git fetch origin main
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo '::error::main cambio y el reordenado choca; esta corrida no se empuja'
            exit 1
          fi
          git push origin HEAD:main

      - name: Avisar a IndexNow
        if: ${{ !inputs.dry_run }}
        run: python3 tools/ping-indexnow.py --daily-hack
